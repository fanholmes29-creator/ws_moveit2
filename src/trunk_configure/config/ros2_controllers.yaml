# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    trunk_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

trunk_group_controller:
  ros__parameters:
    joints:
      - trunk_joint1
      - trunk_joint2
      - trunk_joint3
      - trunk_joint4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity