trunk_joystick_teleop:
  ros__parameters:
    # Relative names are resolved under the node namespace.
    # With robot_namespace:=trunk_robot, these become:
    #   /trunk_robot/joy
    #   /trunk_robot/joint_states
    #   /trunk_robot/trunk_group_controller/controller_state
    #   /trunk_robot/trunk_group_controller/follow_joint_trajectory
    joy_topic: "joy"
    joint_states_topic: "joint_states"
    # Prefer controller actual state for FakeSystem/open-loop controller feedback.
    # joint_states remains available as a fallback state source.
    use_controller_state: true
    controller_state_topic: "trunk_group_controller/controller_state"
    follow_joint_trajectory_action: "trunk_group_controller/follow_joint_trajectory"

    joint_names:
      - trunk_joint1
      - trunk_joint2
      - trunk_joint3
      - trunk_joint4

    step_rad: 0.034906585
    trajectory_duration: 0.5
    joy_timeout: 0.5
    require_deadman: true

    # Yahboom joystick button index cheat sheet:
    #   buttons[0]  -> A
    #   buttons[1]  -> B
    #   buttons[2]  -> (unused/reserved)
    #   buttons[3]  -> X
    #   buttons[4]  -> Y
    #   buttons[5]  -> (unused/reserved)
    #   buttons[6]  -> L1 / LB (deadman)
    #   buttons[7]  -> R1 / RB
    #   buttons[8]  -> L2 / LT
    #   buttons[9]  -> R2 / RT
    #   buttons[10] -> SELECT
    #   buttons[11] -> START
    #   buttons[12] -> left stick press
    #   buttons[13] -> right stick press
    button_a: 0
    button_b: 1
    button_x: 3
    button_y: 4
    button_l1: 6

    # Left stick vertical axis (Yahboom: axes[1], up positive, down negative)
    axis_step: 1
    axis_step_threshold: 0.5
    invert_axis_step: false

    trunk_joint1:
      min: -1.57
      max: 1.57
    trunk_joint2:
      min: -1.57
      max: 1.57
    trunk_joint3:
      min: -1.57
      max: 1.57
    trunk_joint4:
      min: -1.57
      max: 1.57
