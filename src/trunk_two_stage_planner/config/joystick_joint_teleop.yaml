joystick_joint_teleop:
  ros__parameters:
    joy_topic: "/trunk_robot/joy"
    joint_states_topic: "/joint_states"
    follow_joint_trajectory_action: "/trunk_group_controller/follow_joint_trajectory"

    joint_names:
      - trunk_joint1
      - trunk_joint2
      - trunk_joint3
      - trunk_joint4

    step_rad: 0.034906585
    trajectory_duration: 0.5
    joy_timeout: 0.5
    require_deadman: true

    # Yahboom joystick button index cheat sheet:
    #   buttons[0]  -> A
    #   buttons[1]  -> B
    #   buttons[2]  -> (unused/reserved)
    #   buttons[3]  -> X
    #   buttons[4]  -> Y
    #   buttons[5]  -> (unused/reserved)
    #   buttons[6]  -> L1 / LB (deadman)
    #   buttons[7]  -> R1 / RB
    #   buttons[8]  -> L2 / LT
    #   buttons[9]  -> R2 / RT
    #   buttons[10] -> SELECT
    #   buttons[11] -> START
    #   buttons[12] -> left stick press
    #   buttons[13] -> right stick press
    #
    # Current teleop mapping in this node:
    button_a: 0
    button_b: 1
    button_x: 3
    button_y: 4
    button_l1: 6
    # Reserved for future extension:
    # button_r1: 7
    # button_l2: 8
    # button_r2: 9
    # button_select: 10
    # button_start: 11
    # button_left_stick_press: 12
    # button_right_stick_press: 13

    # Left stick vertical axis (Yahboom: axes[1], up positive, down negative)
    axis_step: 1
    axis_step_threshold: 0.5
    invert_axis_step: false

    trunk_joint1:
      min: -1.57
      max: 1.57
    trunk_joint2:
      min: -1.57
      max: 1.57
    trunk_joint3:
      min: -1.57
      max: 1.57
    trunk_joint4:
      min: -1.57
      max: 1.57
